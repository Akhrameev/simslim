name: ci

on:
  pull_request:
    paths-ignore: ["**.md", "docs/**"]
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**"]

permissions:
  contents: read

# A new push to a PR cancels the superseded run. Pushes to main queue instead,
# so every main commit keeps a result.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  swift:
    runs-on: macos-26
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@v6
      - name: Lint
        run: make swift-lint
      - name: Test
        run: make swift-test
      - name: Dependency audit
        run: make verify-deps

      - name: App sources
        run: make app-check
      - name: Build app
        run: VERSION=0.0.0 BUILD_NUMBER="$GITHUB_RUN_NUMBER" make app
      - name: Verify app
        run: |
          codesign --verify --deep --strict --verbose=2 build/SimSlim.app
          plutil -lint build/SimSlim.app/Contents/Info.plist
          test "$(plutil -extract CFBundleShortVersionString raw build/SimSlim.app/Contents/Info.plist)" = "0.0.0"
          test "$(plutil -extract CFBundleVersion raw build/SimSlim.app/Contents/Info.plist)" = "$GITHUB_RUN_NUMBER"
          test "$(build/SimSlim.app/Contents/Resources/simslim --version)" = "simslim 0.0.0"
